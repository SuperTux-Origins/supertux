<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SuperTux Milestone 1 @versionFull@</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a12; color: #c8d0e0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%; gap: 0.75rem;
    }
    canvas.emscripten {
      display: block;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100vw; max-height: 80vh;
      outline: none;
    }
    #status { font-size: 0.9rem; opacity: 0.85; min-height: 1.2em; }
    #progress {
      width: min(320px, 80vw); height: 6px;
      background: #1a1a28; border-radius: 3px; overflow: hidden;
    }
    #progress > div {
      height: 100%; width: 0%; background: #4af;
      transition: width 0.15s ease-out;
    }
    #meta {
      font-size: 0.75rem; opacity: 0.7; text-align: center;
      line-height: 1.5; max-width: 90vw;
    }
    #meta a { color: #8cf; }
    #backup {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; max-width: 90vw;
    }
    #backup button {
      background: #1e2a40; color: #c8d0e0;
      border: 1px solid #3a4a66; border-radius: 4px;
      padding: 0.35rem 0.75rem; cursor: pointer;
      font-size: 0.8rem;
    }
    #backup button:hover { background: #2a3a55; }
    #backup button:disabled { opacity: 0.4; cursor: default; }
    #backup input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">Loading…</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="backup" title="Progress is stored in this browser (IndexedDB). Use these to back up or move to another machine.">
      <button type="button" id="btn-download-backup" disabled>Download backup</button>
      <button type="button" id="btn-upload-backup" disabled>Upload backup…</button>
      <input type="file" id="file-upload-backup" accept=".json,application/json">
    </div>
    <div id="meta">
      SuperTux Milestone 1 <strong>@versionFull@</strong><br>
      <a href="@sourceUrl@" target="_blank" rel="noopener">Source</a>
      ·
      <a href="@revUrl@" target="_blank" rel="noopener">Revision @gitRev@</a>
    </div>
  </div>
  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var progressBar = document.getElementById('progress-bar');

    /* User data root (matches setup.cpp emscripten_prepare_paths). */
    var ST_USER_ROOT = '/home/web_user/.config/supertux-milestone1';

    function stBytesToBase64(u8) {
      var CHUNK = 0x8000;
      var s = '';
      for (var i = 0; i < u8.length; i += CHUNK) {
        s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CHUNK, u8.length)));
      }
      return btoa(s);
    }

    function stBase64ToBytes(b64) {
      var s = atob(b64);
      var u8 = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
      return u8;
    }

    function stWalkFiles(path, root, out) {
      var names;
      try { names = FS.readdir(path); } catch (e) { return; }
      for (var i = 0; i < names.length; i++) {
        var n = names[i];
        if (n === '.' || n === '..') continue;
        var child = path + '/' + n;
        var st;
        try { st = FS.stat(child); } catch (e) { continue; }
        if (FS.isDir(st.mode)) {
          stWalkFiles(child, root, out);
        } else if (FS.isFile(st.mode)) {
          var data = FS.readFile(child, { encoding: 'binary' });
          out[child.slice(root.length)] = stBytesToBase64(data);
        }
      }
    }

    function stEnsureDirs(filePath) {
      var parts = filePath.split('/');
      var cur = '';
      for (var i = 0; i < parts.length - 1; i++) {
        if (!parts[i]) continue;
        cur += '/' + parts[i];
        try { FS.mkdir(cur); } catch (e) {}
      }
    }

    function stDownloadBackup() {
      if (typeof FS === 'undefined') {
        alert('File system not ready yet.');
        return;
      }
      var files = {};
      try {
        stWalkFiles(ST_USER_ROOT, ST_USER_ROOT, files);
      } catch (e) {
        alert('Could not read saves: ' + e);
        return;
      }
      var payload = JSON.stringify({
        format: 'supertux-milestone1-backup',
        version: 1,
        root: ST_USER_ROOT,
        files: files
      }, null, 2);
      var blob = new Blob([payload], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'supertux-milestone1-backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
    }

    function stUploadBackup(file) {
      if (typeof FS === 'undefined') {
        alert('File system not ready yet.');
        return;
      }
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var obj = JSON.parse(reader.result);
          if (!obj || obj.format !== 'supertux-milestone1-backup' || !obj.files) {
            alert('Not a SuperTux Milestone 1 backup file.');
            return;
          }
          var keys = Object.keys(obj.files);
          for (var i = 0; i < keys.length; i++) {
            var rel = keys[i];
            var abs = ST_USER_ROOT + (rel.charAt(0) === '/' ? rel : '/' + rel);
            stEnsureDirs(abs);
            FS.writeFile(abs, stBase64ToBytes(obj.files[rel]));
          }
          if (typeof FS.syncfs === 'function') {
            FS.syncfs(false, function(err) {
              if (err) console.error('syncfs after import:', err);
              alert('Imported ' + keys.length + ' file(s). Reload the page to apply options and slot list.');
            });
          } else {
            alert('Imported ' + keys.length + ' file(s). Reload the page to apply.');
          }
        } catch (e) {
          alert('Import failed: ' + e);
        }
      };
      reader.readAsText(file);
    }

    function stEnableBackupButtons() {
      var dl = document.getElementById('btn-download-backup');
      var ul = document.getElementById('btn-upload-backup');
      var fi = document.getElementById('file-upload-backup');
      if (dl) dl.disabled = false;
      if (ul) ul.disabled = false;
      if (dl) dl.onclick = stDownloadBackup;
      if (ul) ul.onclick = function() { fi && fi.click(); };
      if (fi) fi.onchange = function() {
        if (fi.files && fi.files[0]) stUploadBackup(fi.files[0]);
        fi.value = '';
      };
    }

    var Module = {
      preRun: [],
      postRun: [function() { stEnableBackupButtons(); }],
      print: function(text) {
        if (arguments.length > 1)
          text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
      },
      printErr: function(text) {
        if (arguments.length > 1)
          text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost. Reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          progressBar.style.width = (parseInt(m[2]) / parseInt(m[4]) * 100) + '%';
          statusElement.innerHTML = m[1];
        } else {
          progressBar.style.width = text ? progressBar.style.width : '100%';
          statusElement.innerHTML = text;
          if (!text) document.getElementById('progress').style.display = 'none';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading…');
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
