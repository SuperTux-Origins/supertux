name: Check
on:
  push:
    branches: [master]
  pull_request:          # also run on PRs
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # or keep @v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Helps avoid GitHub API rate limits when evaluating flakes/inputs
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check --keep-going -L
